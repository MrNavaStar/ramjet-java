[package]
name = "system-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "init"
path = "src/init.rs"

[dependencies]
anyhow = "1"
edge-net = { version = "0.16.0", features = ["std", "edge-nal-std"] }
nix = { version = "0.31.3", features = ["mount", "fs", "process", "signal", "net"] }
ocirender = { git = "https://github.com/MrNavaStar/ocirender" }
rtnetlink = "0.23.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt"] }
rand = "0.10.3"
futures-util = "0.3.34"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
