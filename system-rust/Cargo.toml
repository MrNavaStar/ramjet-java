[package]
name = "system-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "init"
path = "src/init.rs"

[dependencies]
anyhow = "1"
nix = { version = "0.31.3", features = ["mount", "fs", "process", "signal"] }
ocirender = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
